[project]
name = "dronevision"
version = "0.2.0"
description = "Autonomous drone ground station: tap-to-track following, obstacle avoidance, live monitoring and a flight data recorder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ultralytics>=8.3.0",
    "opencv-python>=4.8.0",
    "PyYAML>=6.0.1",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "mujoco>=3.2.0",
    "stable-baselines3>=2.3.0",
    "tensorboard>=2.15.0",
    "lap>=0.5.12",
    "mediapipe>=0.10.30",
    "vosk>=0.3.45",
    "sounddevice>=0.5.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.8", "pre-commit>=4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dronevision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "sitl: needs a running ArduPilot SITL (slow; run with -m sitl)",
]
addopts = "-m 'not sitl'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
